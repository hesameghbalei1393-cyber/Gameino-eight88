<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>گیمینو</title>
<style>
:root{--bg:#0b0d1a;--cd:#141a38;--a:#00e5ff;--b:#ff2d95;--fg:#e8ecff;--m:#8a94c4;--p0:#35c8ff;--p1:#ff4d6d;--p2:#5dff8f;--p3:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-y:auto}
.ttl{margin:auto;text-align:center;padding:20px}
.logo{font-size:64px;font-weight:900;letter-spacing:5px;text-shadow:0 0 10px var(--a),0 0 40px var(--b);animation:fl 3s ease-in-out infinite}
.sub{font-size:26px;color:var(--a);text-shadow:0 0 14px var(--a)}.ico{font-size:34px;margin:26px;letter-spacing:10px;animation:fl 2.4s infinite}
.tp{animation:bl 1.2s infinite;font-size:18px;margin-top:30px}.st2{color:var(--m);margin-top:40px;font-size:13px}
@keyframes fl{50%{transform:translateY(-6px)}}@keyframes bl{50%{opacity:.2}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}.pop{animation:pop .28s}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;font-size:18px}
.ib{width:44px;height:44px;border-radius:50%;border:2px solid var(--a);background:#10142a;color:var(--fg);font-size:20px;box-shadow:0 0 10px #00e5ff55;display:flex;align-items:center;justify-content:center}
.lv{flex:1}.lv b{text-shadow:0 0 8px var(--p3);color:var(--p3)}.xb{height:8px;background:#1d2347;border-radius:6px;margin-top:4px;overflow:hidden}.xb i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px}
.tile{border-radius:20px;padding:14px 6px;text-align:center;background:linear-gradient(160deg,hsl(var(--h) 60% 18%),hsl(var(--h) 60% 8%));border:2px solid hsl(var(--h) 100% 60%);box-shadow:0 0 14px hsl(var(--h) 100% 55%/.45),inset 0 0 18px hsl(var(--h) 100% 55%/.15);animation:fl 3.2s ease-in-out infinite}
.tile:active{filter:brightness(1.5)}.tile .e{font-size:42px;display:block}.tile b{display:block;font-size:16px;margin:4px 0}.tile small{color:var(--m);font-size:11px;display:block}.tile em{font-style:normal;font-size:12px;color:var(--p3)}
.foot{text-align:center;color:var(--m);font-size:12px;padding:18px}
.st{text-align:center;font-weight:800;padding:6px 12px;min-height:30px;white-space:pre-line;text-shadow:0 0 10px var(--a)}
.sc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:2px}
.chip{padding:3px 12px;border-radius:16px;color:#001;font-weight:800;font-size:14px;box-shadow:0 0 10px currentColor}
.body{display:flex;flex-direction:column;align-items:center;padding:8px 12px;gap:14px;flex:1}
.grid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:6px;width:min(94vw,440px);direction:ltr}
.grid.mem{width:min(72vw,320px);transform:translateX(-18px)}.grid.chomp{width:min(88vw,390px)}
.cell{aspect-ratio:1;background:var(--cd);border:1px solid #2a3470;border-radius:12px;font-size:min(12vw,46px);font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 10px #0008}
.cell i{display:block;width:78%;aspect-ratio:1;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
.c4 .cell{background:#102a6b}.c4 .cell i{background:#070b1e;box-shadow:none}.rv .cell{background:#0f3d2a}.gm .cell{border-radius:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pad{border:2px solid var(--a);background:#10142a;color:var(--fg);border-radius:16px;padding:12px 18px;font-size:18px;font-weight:800;box-shadow:0 0 12px #00e5ff55;text-align:center}
.pad.on{background:var(--a);color:#001;box-shadow:0 0 20px var(--a)}.pad:active{transform:scale(.94)}
.big{width:92px;height:106px;font-size:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px}.big small{font-size:13px}
.stick{display:inline-block;width:11px;height:62px;margin:4px;background:#d7a86e;border-top:13px solid #ff2d55;border-radius:6px;box-shadow:0 0 8px #ff2d5580}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mb{background:#0e1230;border:2px solid var(--a);border-radius:22px;padding:22px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 0 30px #00e5ff55;max-height:92vh;overflow:auto}
 .setupmb{width:min(100%,540px);padding:18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0a0e24;padding:6px;border-radius:16px}.tab{border:1px solid #2a3470;background:#141a38;color:var(--fg);border-radius:12px;padding:11px 5px;font-size:15px;font-weight:800}.tab.on{background:var(--a);color:#001;box-shadow:0 0 14px #00e5ff77}.panel{display:none;gap:12px;flex-direction:column}.panel.on{display:flex}.panel .row{width:100%}.panel .pad{flex:1;min-width:120px}.guide{text-align:right;background:#10142a;border:1px solid #2a3470;border-radius:16px;padding:14px;line-height:2;color:var(--fg)}.guide h3{margin:0 0 8px;color:var(--a)}
.mb h2{margin:0;font-size:28px}.win{color:var(--p2);text-shadow:0 0 16px var(--p2)}.lose{color:var(--p1);text-shadow:0 0 16px var(--p1)}.mb p{margin:0;line-height:2;color:var(--m)}
.lk{display:flex;justify-content:space-between;background:#141a38;padding:12px;border-radius:14px;color:var(--fg);text-decoration:none;border:1px solid #2a3470;font-size:14px}.lk small{direction:ltr;color:var(--m)}
.tz{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:min(96vw,460px);height:min(68vh,520px);position:relative}
.zn{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#001;font-weight:900;overflow:hidden;position:relative}.zn b{font-size:60px}.zn i{position:absolute;bottom:0;left:0;height:8px;background:#fff;box-shadow:0 0 10px #fff}
.go{position:absolute;inset:0;background:#000a;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;text-shadow:0 0 20px var(--a);z-index:2;text-align:center}
.man{display:grid;grid-template-columns:1fr 6fr 1fr;gap:6px;width:min(96vw,460px);direction:ltr}.mm{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pit{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#001;transition:.2s}
.sto{border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#001}
.die{width:110px;height:110px;border-radius:22px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900;box-shadow:0 0 24px #fff}
.mp{display:flex;gap:10px;min-height:64px;align-items:center;justify-content:center}.mq{font-size:44px;font-weight:900;direction:ltr;text-shadow:0 0 16px var(--b)}
</style></head><body>
<canvas id="bg"></canvas><div id="ui"></div><canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s),FA=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const COL=['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const MYKET_URL='';
const BAZAAR_URL='';
let cfg,cur,epoch=0,playing=false,S={},mute=false;
try{S=JSON.parse(localStorage.g||'{}');mute=localStorage.m=='1'}catch(e){}
const save=()=>{try{localStorage.g=JSON.stringify(S)}catch(e){}};
const isBot=i=>cfg.bot&&i==1,nm=i=>isBot(i)?'ربات 🤖':'بازیکن '+FA(i+1);
const later=(f,ms=600)=>{const e=epoch;setTimeout(()=>{if(e==epoch)f()},ms)};
/* ---- sound / fx ---- */
let AC;function snd(f=440,d=.08,t='square',v=.05){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const tick=()=>{snd(520,.06);navigator.vibrate&&navigator.vibrate(8)};
const winSnd=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.15,'triangle',.08),i*110));
const pop=e=>{e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')};
const bg=$('#bg'),fx=$('#fx'),bc=bg.getContext('2d'),fc=fx.getContext('2d');let W,H,stars=[],conf=[];
const rs=()=>{W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight};addEventListener('resize',rs);rs();
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.4,s:Math.random()*.0007+.0002,h:R(360)});
(function lp(){bc.clearRect(0,0,W,H);for(const s of stars){s.y+=s.s;if(s.y>1)s.y=0;bc.fillStyle=`hsla(${s.h},100%,70%,.55)`;bc.beginPath();bc.arc(s.x*W,s.y*H,s.r,0,7);bc.fill()}
fc.clearRect(0,0,W,H);conf=conf.filter(p=>p.l>0);for(const p of conf){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;fc.fillStyle=p.c;fc.fillRect(p.x,p.y,6,9)}requestAnimationFrame(lp)})();
const boom=()=>{for(let i=0;i<130;i++)conf.push({x:W/2,y:H/3,vx:(Math.random()-.5)*15,vy:-Math.random()*15,l:90+R(50),c:`hsl(${R(360)},100%,60%)`})};
/* ---- helpers ---- */
function mk(body,r,q,fn,cls=''){const g=el('div','grid '+cls);g.style.setProperty('--c',q);const a=[];for(let i=0;i<r*q;i++){const b=el('div','cell');b.onpointerdown=()=>fn(i);g.append(b);a.push(b)}body.append(g);return a}
const dot=(e,col)=>{e.innerHTML='<i></i>';e.style.color=col;pop(e.firstChild)};
function overlay(h){const o=el('div','ov');o.innerHTML='<div class="mb">'+h+'</div>';document.body.append(o);return o}
function end(w,x=''){const won=w>=0&&!(cfg.bot&&w==1);const m=w<0?'مساوی شد 🤝':cfg.bot&&w==1?'ربات برد 🤖':nm(w)+' برنده شد! 🎉';
 S.xp=(S.xp||0)+(won?(cfg.bot?3:1):0);if(won&&cfg.bot){S.w=S.w||{};S.w[cur.id]=(S.w[cur.id]||0)+1}save();
 if(won){boom();winSnd()}else snd(160,.4,'sawtooth',.06);
 const o=overlay(`<h2 class="${won?'win':'lose'}">${m}</h2>${x?'<p>'+x+'</p>':''}${won&&cfg.bot?'<p>⭐ ۳ امتیاز تجربه گرفتی</p>':''}<div class="row"><div class="pad" id="a1">↻ دوباره</div><div class="pad" id="a2">🏠 منو</div></div>`);
 o.querySelector('#a1').onclick=()=>{o.remove();run()};o.querySelector('#a2').onclick=()=>{o.remove();history.back()}}
/* ---- screens ---- */
function title(){const u=$('#ui');u.innerHTML='<div class="ttl"><div class="logo">GAMINO</div><div class="sub">گیمینو</div><div class="ico">❌ ⭕ 🎲 🧠</div><div class="tp">برای شروع لمس کن</div><div class="st2">Eight⁸ Studio • نسخه ۱.۰</div></div>';u.onclick=()=>{u.onclick=null;snd(660,.12);lobby()}}
function lobby(){const u=$('#ui');u.innerHTML='';const xp=S.xp||0,h=el('div','hud');h.innerHTML=`<div class="lv"><b>سطح ${FA(1+Math.floor(xp/5))}</b><div class="xb"><i style="width:${(xp%5)*20}%"></i></div></div>`;
 const sb=el('div','ib',mute?'🔇':'🔊');sb.onclick=()=>{mute=!mute;try{localStorage.m=mute?1:0}catch(e){}sb.textContent=mute?'🔇':'🔊';tick()};const ab=el('div','ib','ℹ️');ab.onclick=about;h.append(sb,ab);
 const g=el('div','home');GAMES.forEach((x,i)=>{const w=(S.w||{})[x.id]||0,d=el('div','tile',`<span class="e">${x.e}</span><b>${x.n}</b><small>${x.d}</small><em>${w?'🏆 '+FA(w):'&nbsp;'}</em>`);d.style.setProperty('--h',(i*29+190)%360);d.style.animationDelay=i*.15+'s';d.onclick=()=>{snd(600,.08);setup(x)};g.append(d)});
 u.append(h,g,el('div','foot','ساخته‌شده توسط Eight⁸ • نسخه ۱.۰'))}
 function setup(g){
  let lv=1,pl=2,tab='bot';
  const o=overlay('');
  const guides={
   xo:'هر بازیکن تلاش می‌کند سه علامت خودش را در یک ردیف، ستون یا قطر قرار دهد. هرکس زودتر سه‌تا بسازد برنده است.',
   gom:'مهره‌ها را روی صفحه قرار دهید و تلاش کنید پنج مهرهٔ خودتان را پشت سر هم در یک ردیف، ستون یا قطر بسازید.',
   c4:'مهرهٔ خود را در یکی از ستون‌ها بیندازید. هدف این است که چهار مهرهٔ خودتان را پشت سر هم قرار دهید.',
   rev:'مهره را طوری قرار دهید که مهره‌های حریف بین مهره‌های شما قرار بگیرند؛ مهره‌های محصورشده به رنگ شما برمی‌گردند. در پایان، رنگ بیشتر برنده است.',
   nim:'در هر نوبت تعدادی چوب انتخاب می‌کنید. طبق قانون بازی، آخرین چوب را برندارید؛ انتخاب درست و مدیریت نوبت‌ها مهم است.',
   rps:'سنگ، کاغذ یا قیچی را انتخاب کنید. سنگ قیچی را می‌برد، قیچی کاغذ را و کاغذ سنگ را. اولین نفر که به ۳ امتیاز برسد برنده است.',
   chomp:'شکلات‌ها را از ردیف‌ها انتخاب کنید، اما مراقب شکلات ☠️ باشید؛ کسی که آن را انتخاب کند بازنده می‌شود. برای برد، حرکت‌های حریف را پیش‌بینی کنید.',
   mem:'کارت‌ها را یکی‌یکی برگردانید و جای شکل‌ها را به خاطر بسپارید. دو کارت مشابه یک جفت هستند و با پیدا کردن جفت‌ها امتیاز می‌گیرید.',
   pig:'تاس بیندازید و امتیاز جمع کنید؛ قبل از اینکه شانس برگردد می‌توانید امتیاز دور را ذخیره کنید. اگر ۱ بیاید، امتیاز دور از دست می‌رود.',
   man:'دانه‌ها را بین خانه‌ها جابه‌جا کنید و با جمع‌کردن دانه‌های بیشتر امتیاز بگیرید. حرکت‌ها را طوری انتخاب کنید که در پایان امتیاز بیشتری داشته باشید.',
   tap:'وقتی بازی شروع شد، هرچه سریع‌تر ضربه بزنید و امتیاز بیشتری نسبت به حریف جمع کنید.',
   mth:'سؤال ریاضی را سریع حل کنید و جواب درست را انتخاب کنید. پاسخ سریع‌تر و درست، امتیاز بیشتری برای شما می‌آورد.'
  };
  const guide=guides[g.id]||'قوانین و هدف بازی را بخوانید، سپس حالت بازی موردنظر خود را انتخاب کنید.';
  const build=()=>{
   const box=o.firstChild; box.className='mb setupmb';
   box.innerHTML=`<h2>${g.e} ${g.n}</h2>
    <p>${g.d}</p>
    <div class="tabs">
      <button class="tab ${tab==='bot'?'on':''}" data-tab="bot">🤖 بازی با بات</button>
      <button class="tab ${tab==='friends'?'on':''}" data-tab="friends">👥 بازی با دوستان</button>
      <button class="tab ${tab==='guide'?'on':''}" data-tab="guide">📖 راهنما</button>
    </div>
    <div class="panel ${tab==='bot'?'on':''}">
      <b>سختی بات را انتخاب کن</b>
      <div class="row">${['😊 آسان','🔥 متوسط','💀 سخت'].map((x,i)=>`<button class="pad ${lv==i?'on':''}" data-a="l${i}">${x}</button>`).join('')}</div>
      <button class="pad on" data-a="go">▶ شروع بازی با بات</button>
    </div>
    <div class="panel ${tab==='friends'?'on':''}">
      ${g.m>2?`<b>تعداد بازیکنان را انتخاب کن</b><div class="row">${[2,3,4].filter(x=>x<=g.m).map(x=>`<button class="pad ${pl==x?'on':''}" data-a="p${x}">${FA(x)} نفر</button>`).join('')}</div>`:`<p>این بازی برای دو بازیکن طراحی شده است.</p>`}
      <button class="pad on" data-a="go">▶ شروع بازی با دوستان</button>
    </div>
    <div class="panel ${tab==='guide'?'on':''}">
      <div class="guide"><h3>📖 راهنمای بازی</h3><div>${guide}</div></div>
    </div>
    <button class="pad" data-a="cl">بستن</button>`;
   box.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;snd(500,.05);build()});
   box.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{
    const a=x.dataset.a;snd(500,.05);
    if(a==='l0'||a==='l1'||a==='l2'){lv=+a[1];build();return}
    if(a&&a[0]==='p'){pl=+a[1];build();return}
    if(a==='cl'){o.remove();return}
    if(a==='go'){o.remove();cfg={bot:tab==='bot',level:lv,players:tab==='bot'?2:(g.m>2?pl:2)};cur=g;playing=true;history.pushState({},'');run();}
   });
  };
  build();
 }
function run(){epoch++;const u=$('#ui');u.innerHTML='';const h=el('div','hud'),bk=el('div','ib','→'),rr=el('div','ib','↻');bk.onclick=()=>history.back();rr.onclick=run;h.append(bk,el('b','',cur.e+' '+cur.n),rr);
 const st=el('div','st'),sc=el('div','sc'),body=el('div','body');u.append(h,st,sc,body);
 cur.f({body,status:x=>st.textContent=x,score:(a,t)=>{sc.innerHTML='';a.forEach((v,i)=>{const c=el('span','chip',nm(i)+': '+FA(v));c.style.background=COL[i];c.style.opacity=i==t?1:.45;sc.append(c)})},end})}
onpopstate=()=>{if(!playing)return;playing=false;epoch++;document.querySelectorAll('.ov').forEach(x=>x.remove());lobby()};
function about(){const o=overlay(`<h2>گیمینو</h2><p>نسخه ۱.۰ • Eight⁸</p><p>Eight⁸ مجموعه‌ای برای ساخت برنامه‌های خلاقانه و کاربردی است. گیمینو با هدف جمع کردن بازی‌های ساده و سرگرم‌کننده برای بازی با دوستان یا ربات روی یک گوشی ساخته شده.</p>
<a class="lk" href="https://rubika.ir/Studio_Eight8" target="_blank" rel="noopener"><span>کانال روبیکا</span><small>@Studio_Eight8</small></a><div class="lk" id="cp"><span>ارتباط با توسعه‌دهنده</span><small>@Hesam23799</small></div><a class="lk" href="mailto:hesameghbalei1391@gmail.com"><span>ارسال بازخورد با ایمیل</span><small>hesameghbalei1391@gmail.com</small></a><div class="lk" id="rate"><span>⭐ امتیاز به گیمینو</span><small>مایکت</small></div><p style="font-size:13px">این برنامه هیچ اطلاعات شخصی‌ای جمع‌آوری نمی‌کند و برای بازی به اینترنت نیاز ندارد.</p><div class="pad" id="cl">بستن</div>`);

function chomp(c){const CR=5,CC=6,memo={};let len=Array(CR).fill(CC),t=0,o=0;
const cut=(s,r,q)=>{const n=[...s];for(let i=r;i<CR;i++)if(n[i]>q)n[i]=q;return n};

const bot=()=>{const a=mv();if(!a.length)return[0,0];if(cfg.level==2||(cfg.level==1&&R(100)<50)){const g=a.filter(m=>!cw(cut(len,m[0],m[1])));if(g.length)return pick(g)}return pick(a)};

function rd(){c.status(note||'نوبت '+nm(t));c.score([b[6],b[13]],t);wr.innerHTML='';const s1=el('div','sto',FA(b[13]));s1.style.background=COL[1];const s0=el('div','sto',FA(b[6]));s0.style.background=COL[0];const mid=el('div','mm');
 for(let k=0;k<12;k++){const i=k<6?12-k:k-6,pit=el('div','pit',FA(b[i])),mine=i<6?0:1;pit.style.background=COL[mine];const act=!o&&!isBot(t)&&t==mine&&b[i]>0;pit.style.opacity=act?1:.4;if(act)pit.style.boxShadow='0 0 14px '+COL[mine];pit.onpointerdown=()=>tap(i);mid.append(pit)}wr.append(s1,mid,s0)}
function tap(i){if(o||isBot(t)||b[i]==0||(t?i<7||i>12:i>5))return;mv(i)}
function mv(i){tick();const ex=sow(b,i,t);if(emp(b,0)||emp(b,1)){sweep(b);o=1;rd();return c.end(b[6]==b[13]?-1:b[6]>b[13]?0:1,FA(b[6])+' : '+FA(b[13]))}if(!ex)t=1-t;note=ex?'نوبت دوباره برای '+nm(t)+'!':'';rd();if(isBot(t))later(()=>{if(!o&&isBot(t))mv(bot())},800)}rd()}

function tap_(c){const G=40,n=cfg.players,tp=Array(n).fill(0);let on=0;const ord=n==2?[1,0]:n==3?[2,0,1]:[2,3,0,1],w=el('div','tz'),zs=[];c.body.append(w);
ord.forEach(i=>{const z=el('div','zn',`<span>${nm(i)}</span><b>0</b><i style="width:0"></i>`);z.style.background=COL[i];if(n==2||(n==3&&i==2))z.style.gridColumn='span 2';if(!cfg.bot&&n==2&&i==1)z.style.transform='rotate(180deg)';z.onpointerdown=()=>hit(i);zs[i]=z;w.append(z)});
const go=el('div','go','آماده؟<br><small style="font-size:18px">لمس کن</small>');w.append(go);c.status(`اول به ${FA(G)} ضربه برسد برنده است!`);
go.onpointerdown=()=>{go.onpointerdown=null;let k=3;const f=()=>{if(k>0){go.textContent=FA(k--);snd(440,.1);later(f,700)}else{go.remove();on=1;snd(880,.25);if(cfg.bot)bl()}};f()};
const bl=()=>{if(!on)return;hit(1);later(bl,[420,260,170][cfg.level]*(.8+Math.random()*.4))};
function hit(i){if(!on)return;tp[i]++;const z=zs[i];z.querySelector('b').textContent=FA(tp[i]);z.querySelector('i').style.width=tp[i]/G*100+'%';if(!isBot(i))snd(300+tp[i]*8,.04);if(tp[i]>=G){on=0;c.end(i)}}}

function mth(c){const sc=[0,0];let id=0,ans=0,lk=[0,0],o=0;const top=el('div','mp'),q=el('div','mq'),bt=el('div','mp');c.body.append(top,q,bt);if(!cfg.bot)top.style.transform='rotate(180deg)';c.body.style.justifyContent='space-around';
function nq(){id++;const a=R(12)+2,b=R(9)+2,op=pick(['+','-','×']);ans=op=='+'?a+b:op=='-'?a-b:a*b;q.textContent=`${FA(a)} ${op} ${FA(b)} = ؟`;const ch=new Set([ans]);while(ch.size<3)ch.add(ans+pick([-3,-2,-1,1,2,3,10,-10]));const arr=[...ch].sort(()=>Math.random()-.5);lk=[0,0];
 [bt,top].forEach((z,p)=>{z.innerHTML='';if(p==1&&cfg.bot){z.innerHTML='<div style="color:var(--m)">ربات 🤖 فکر می‌کند…</div>';return}arr.forEach(v=>{const b=el('div','pad big',FA(v));b.style.cssText+=';width:92px;height:70px;font-size:26px';b.onpointerdown=()=>ansr(p,v,b);z.append(b)})});
 c.score(sc,-1);c.status('سریع‌تر جواب بده! (اول به ۵ امتیاز)');if(cfg.bot){const my=id;later(()=>{if(my==id&&!o)ansr(1,Math.random()<[.6,.85,.97][cfg.level]?ans:ans+1,null)},[2800,1700,1000][cfg.level]*(.7+Math.random()*.6))}}
function ansr(p,v,b){if(o||lk[p])return;if(v==ans){sc[p]++;snd(880,.12);c.score(sc,-1);if(sc[p]>=5){o=1;return c.end(p)}nq()}else{lk[p]=1;snd(160,.2,'sawtooth');if(b)b.style.opacity=.25;if(lk[0]&&lk[1]){id++;later(nq,600)}}}nq()}

{id:'pig',e:'🎲',n:'تاس خوک',d:'ریسک کن یا ذخیره کن',m:4,f:pig},{id:'man',e:'🌰',n:'منقله',d:'دانه‌ها را جمع کن',m:2,f:man},
{id:'tap',e:'⚡',n:'رقابت ضربه',d:'سریع‌تر بزن!',m:4,f:tap_},{id:'mth',e:'➕',n:'دوئل ریاضی',d:'زودتر جواب بده',m:2,f:mth}];
